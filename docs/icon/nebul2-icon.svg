<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22303f"/>
      <stop offset="1" stop-color="#121a24"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b06a"/>
      <stop offset="0.5" stop-color="#b5883f"/>
      <stop offset="1" stop-color="#7f5a22"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efdc"/>
      <stop offset="1" stop-color="#cfc2a3"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d98a"/>
      <stop offset="1" stop-color="#b08a2e"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- tuner arc: the signature. In-tune tick at top centre. -->
  <g fill="none" stroke-linecap="round">
    <path d="M 116 330 A 160 160 0 0 1 396 330" stroke="#5d6f82" stroke-width="10"/>
    <!-- side ticks -->
    <line x1="96.0" y1="330.0" x2="82.0" y2="330.0" stroke="#5d6f82" stroke-width="8"/>
    <line x1="117.4" y1="250.0" x2="105.3" y2="243.0" stroke="#5d6f82" stroke-width="8"/>
    <line x1="176.0" y1="191.4" x2="169.0" y2="179.3" stroke="#5d6f82" stroke-width="8"/>
    <line x1="336.0" y1="191.4" x2="343.0" y2="179.3" stroke="#5d6f82" stroke-width="8"/>
    <line x1="394.6" y1="250.0" x2="406.7" y2="243.0" stroke="#5d6f82" stroke-width="8"/>
    <line x1="416.0" y1="330.0" x2="430.0" y2="330.0" stroke="#5d6f82" stroke-width="8"/>
    <!-- centre "in tune" tick -->
    <line x1="256" y1="170" x2="256" y2="128" stroke="#7fd8b8" stroke-width="16"/>
  </g>
  <circle cx="256" cy="128" r="14" fill="#7fd8b8"/>
  <circle cx="256" cy="128" r="26" fill="#7fd8b8" opacity="0.18"/>

  <!-- baroque flute: head (left) to foot (right), conical, one key -->
  <g transform="translate(256 330) scale(1.1)">
    <!-- head joint, thickest -->
    <rect x="-208" y="-24" width="132" height="48" rx="10" fill="url(#wood)"/>
    <!-- cap -->
    <rect x="-216" y="-27" width="22" height="54" rx="8" fill="url(#ivory)"/>
    <!-- embouchure hole -->
    <ellipse cx="-150" cy="0" rx="13" ry="9" fill="#1a1208"/>
    <!-- ferrule head/body -->
    <rect x="-84" y="-26" width="18" height="52" rx="6" fill="url(#ivory)"/>

    <!-- body joint, six finger holes, slight taper -->
    <path d="M -66 -22 L 128 -17 Q 136 -17 136 -9 L 136 9 Q 136 17 128 17 L -66 22 Z" fill="url(#wood)"/>
    <g fill="#1a1208">
      <circle cx="-38" cy="0" r="8"/>
      <circle cx="-10" cy="0" r="8"/>
      <circle cx="18" cy="0" r="8"/>
      <circle cx="60" cy="0" r="7.5"/>
      <circle cx="86" cy="0" r="7.5"/>
      <circle cx="112" cy="0" r="7.5"/>
    </g>
    <!-- ferrule body/foot -->
    <rect x="134" y="-21" width="16" height="42" rx="5" fill="url(#ivory)"/>

    <!-- foot joint: almost cylindrical -->
    <path d="M 150 -16 L 206 -15 Q 212 -15 212 -9 L 212 9 Q 212 15 206 15 L 150 16 Z" fill="url(#wood)"/>
    <rect x="206" y="-19" width="14" height="38" rx="5" fill="url(#ivory)"/>
    <!-- D# key: long lever lying along the foot joint, pad cup near the end, touch near the ferrule -->
    <rect x="176" y="-22" width="10" height="9" rx="2" fill="#5a3f14"/>              <!-- mounting block -->
    <rect x="152" y="-28" width="52" height="7" rx="3.5" fill="url(#brass)"/>       <!-- lever -->
    <path d="M 156 -24 L 168 -24 L 172 -33 Q 166 -37 156 -34 Z" fill="url(#brass)"/> <!-- touch -->
    <circle cx="204" cy="-21" r="9" fill="url(#brass)"/>                            <!-- pad cup -->
  </g>
</svg>
